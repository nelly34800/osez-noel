<div class="scene text-center text-white">
  <div class="scene-content">
    <h1>Modifier vos informations</h1>
  </div>
</div>

<div class="container p-4">
  <form>
    <div class="mb-3">
      <label for="lastName" class="form-label">Nom</label>
      <input type="text" class="form-control" id="lastName" placeholder="Votre nom"/>
       <div class="invalid-feedback">
        Le nom est requis
      </div>
    </div>
    <div class="mb-3">
      <label for="firstName" class="form-label">Prénom</label>
      <input type="text" class="form-control" id="firstName" placeholder="Votre prénom"/>
      <div class="invalid-feedback">
          Le prénom est requis
        </div>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary" id="validationModification">Modifier vos informations</button>
      <button type="button" class="btn btn-danger">Supprimer mon compte</button>
    </div>
    <div class="text-center pt-3">
      <a href="editPassword"> Cliquer ici pour modifier votre mot de passe </a>
    </div>
  </form>
</div>
